[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-agent"
version = "0.1.0"
description = "Read-only SAP OData assistant with demo mode"
requires-python = ">=3.10"
dependencies = ["openai>=1.50", "httpx>=0.27", "pydantic>=2", "pydantic-settings>=2", "pyyaml>=6", "python-dotenv>=1", "rich>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[project.scripts]
sap-agent = "sap_agent.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sap_agent --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["sap_agent"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
